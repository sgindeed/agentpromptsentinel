[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentpromptsentinel"
version = "0.1.2"
description = "A multi-tiered defensive pipeline for stopping prompt injection, jailbreaks, and domain hijacking."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "PromptSentinel Team" }
]
dependencies = [
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
ml = [
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.0"
]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0"
]

[tool.pytest.ini_options]
asyncio_mode = "strict"

[tool.hatch.build.targets.wheel]
packages = ["src/agentpromptsentinel"]