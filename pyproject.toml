[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentbastion"
version = "0.1.2"
description = "A pipeline for stopping prompt injection and domain hijacking."
requires-python = ">=3.10"
# Core dependencies only - keeps the base package under 5MB
dependencies = [
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
# Heavy ML dependencies installed via: pip install agentbastion[ml]
ml = [
    "transformers>=4.0.0",
    "torch>=2.0.0",
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.0"
]
test = [
    "pytest",
    "pytest-asyncio"
]

[tool.pytest.ini_options]
asyncio_mode = "strict"